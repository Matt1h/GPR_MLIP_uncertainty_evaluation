hydra:
  run:
    dir: ${result_dir}
  sweep:
    dir: ${result_dir}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 4320
    cpus_per_task: null
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: null
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: gpu
    qos: null
    comment: null
    constraint: null
    exclude: null
    gres: gpu:1
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: imacm_gpu
    signal_delay_s: 120
    max_num_timeout: 0
    additional_parameters: {}
    array_parallelism: 256
    setup:
    - module load 2021a CUDA/11.4.2
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra/launcher=submitit_slurm
    - hydra.mode=MULTIRUN
    task:
    - molecule=o-hbdi
    - experiment=candidate_based_al
    - experiment.uncertainty_function_name=random
    - experiment.model_init.result_name=combinations3_1000
    - method/kernel=atomistic_sum1
    - method.kernel.kernel.bs=50
    - representation=soap_atomistic
    - dataset.remove_offset=True
    - dataset.trajectory_type=ws22
    - dataset.trajectory_name=full
    - dataset.function.property_=gs_energy
    - dataset.calculation_methods=[ws22_energies]
    - result_name=combinations3_1000-likelihood-no_fast_pred
  job:
    name: ${result_name}
    chdir: null
    override_dirname: dataset.calculation_methods=[ws22_energies],dataset.function.property_=gs_energy,dataset.remove_offset=True,dataset.trajectory_name=full,dataset.trajectory_type=ws22,experiment.model_init.result_name=combinations3_1000,experiment.uncertainty_function_name=random,experiment=candidate_based_al,method.kernel.kernel.bs=50,method/kernel=atomistic_sum1,molecule=o-hbdi,representation=soap_atomistic,result_name=combinations3_1000-likelihood-no_fast_pred
    id: '2020819_2'
    num: 2
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /beegfs/holzenkamp/dev/active_learning/active
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /beegfs/holzenkamp/dev/active_learning/active/config
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /beegfs/holzenkamp/dev/experiments/o-hbdi/candidate_based_al/ws22_full_ws22_energies/GPR_soap_atomistic_atomistic_sum1/combinations3_1000-likelihood-no_fast_pred/2
    choices:
      hydra: cluster_gpu
      representation: soap_atomistic
      method: gpr
      method/kernel: atomistic_sum1
      method/likelihood: gaussian
      dataset: trajectory
      experiment: candidate_based_al
      experiment/contexts: no_fast_pred
      experiment/model_init: load_state_dict
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_slurm
      hydra/output: default
  verbose: false
