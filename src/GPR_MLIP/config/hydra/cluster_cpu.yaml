# @package _global_

hydra:
  run:
    dir: ${result_dir}
  job:
    name: ${result_name}
  sweep:
    dir: ${result_dir}
    subdir: ${hydra.job.num}
  launcher:
    partition: normal
    # nodes
    nodes: 1
    # tasks
#    ntasks: 1
#    ntasks-per-node
#    ntasks-per-core: 1
#    cpus_per_task: 1
#    mem-per-cpu: 4G
    timeout_min: 60
